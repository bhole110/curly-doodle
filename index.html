:root{color-scheme:dark;--purple:#7857ff;--violet:#9b5cff;--muted:#a7afc3}

html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:

.page{width:min(100%,430px);position:relative}
.card{position:relative;overflow:hidden;text-align:center;padding:30px 26px 27px;border:1px solid rgba(255,255,255,.11);border-radius:30px;background:linear-gradient(155deg,#17171d 0%,#101014 65%,#15131c 100%);box-shadow:0 25px 70px rgba(0,0,0,.58),0 0 35px rgba(120,87,255,.12)}

.avatar-wrap{width:126px;height:126px;margin:2px auto 20px;padding:5px;border-radius:50%;background:linear-gradient(135deg,#d7b6ff,#fff,#7ce6d4);box-shadow:0 0 0 5px rgba(141,103,255,.10),0 12px 28px rgba(0,0,0,.42);position:relative}

.underline{width:72px;height:4px;border-radius:9px;margin:13px auto 19px;background:linear-gradient(90deg,#cdaaff,#75e3d3)}
.subtitle{margin:0 auto 25px;max-width:310px;color:#aeb4c7;font-weight:650;font-size:15.5px;line-height:1.6}
.join{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:66px;padding:16px 18px;border-radius:21px;text-decoration:none;color:#fff;font-size:18px;font-weight:800;background:linear-gradient(110deg,#7156f5,#a05bff);border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 28px rgba(117,81,255,.38),inset 0 1px 0 #ffffff55;transition:transform .18s,box-shadow .18s}
.join:hover{transform:translateY(-2px);box-shadow:0 16px 32px rgba(117,81,255,.48),inset 0 1px 0 #ffffff66}

.arrows span:nth-child(2){animation-delay:.13s;color:#c3a4ff}.arrows span:nth-child(3){animation-delay:.26s;color:#e0cfff}
@keyframes bob{0%,100%{transform:translateY(-3px);opacity:.65}50%{transform:translateY(3px);opacity:1}}
.note{font-size:12.5px;color:#969db2;font-weight:650;margin:0 0 23px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#ffffff20,transparent);margin:0 0 20px}
.offer{display:flex;align-items:center;justify-content:center;gap:17px}
.timer{width:72px;height:72px;flex:0 0 72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 10deg,#a05bff,#6d5aff 70%,#30313a 70%);padding:5px}
.timer-inner{width:100%;height:100%;border-radius:50%;background:#17171d;display:grid;place-items:center;font-family:Georgia,serif;font-size:25px;font-weight:800}
.offer-text{text-align:left}
.offer-title{font-size:12px;letter-spacing:2px;font-weight:850;color:#a98cff;margin-bottom:5px}
.offer-sub{font-size:12.5px;color:#aeb4c7;font-weight:650;margin-bottom:8px}
.live{display:inline-flex;align-items:center;gap:7px;border:1px solid #236c54;background:#15372d;color:#73e0b6;padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:750}
.dot{width:7px;height:7px;border-radius:50%;background:#69e2b1;box-shadow:0 0 9px #69e2b188}
